# DOWNSTREAM-FORK (2026-11-17): this whole crate is new in the fork. See docs/person-recognition.md (5.1, "Runtime options evaluated").
[package]
name = "digup-faces"
version = "0.1.0"
edition = "2021"
description = "DigUps face program: detects faces in prepared pictures and returns an embedding for each (YuNet and SFace through ONNX Runtime), as a process the index service starts"
publish = false

[lib]
name = "digup_faces"

[[bin]]
name = "digup-faces"
path = "src/main.rs"

[dependencies]
# The same pre-release ort that Lap pins; ONNX Runtime is linked in (downloaded at build time), so there is no separate runtime DLL to ship.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
ndarray = "0.16"
# Only the two formats DigUp writes its prepared pictures in.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
